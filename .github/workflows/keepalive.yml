# Free Render services sleep after ~15 idle minutes (the next visit waits ~1 minute). A ping every 10 minutes keeps the demo API awake.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://eklavya-examprep-api.onrender.com/ > /dev/null
